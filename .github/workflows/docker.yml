name: 4. Docker Build & Container Scan

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------
      # Build Backend Image
      # --------------------------
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: doctor-platform-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------
      # Build Frontend Image
      # --------------------------
      - name: Check Frontend Dockerfile
        id: frontend
        run: |
          if [ -f frontend/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Frontend Image
        if: steps.frontend.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: doctor-platform-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------
      # Scan Backend Image
      # --------------------------
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: doctor-platform-backend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # --------------------------
      # Scan Frontend Image
      # --------------------------
      - name: Scan Frontend Image
        if: steps.frontend.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: doctor-platform-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Docker Summary
        if: success()
        run: |
          echo "## 🐳 Docker Build Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Image | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Image | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Image Scan | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Ready for Deployment | ✅ |" >> $GITHUB_STEP_SUMMARY