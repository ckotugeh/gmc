name: GMC CI/CD pipeline

on:
  push: 
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  # NODE 1A: Backend Quality Checking
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download Dependencies
        run: go mod download

      - name: Verify Formatting
        run: |
          if [ "$(gofmt -l .)" ]; then
            echo "Files need formatting"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./...

      - name: Build Backend
        run: go build -v ./...

  # NODE 1B: Frontend Quality Checking (Runs in parallel with Backend)
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  # NODE 2: Active Build Verification
  compile-binary:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend] # Triggers only after BOTH code quality checks pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        working-directory: ./backend
        run: go build -v ./...

  # NODE 3: Containerized Database Integration Testing & Docker Build
  integration-tests:
    name: Containerized Testing Suite
    runs-on: ubuntu-latest
    needs: compile-binary # Depends directly on the verification node passing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: doctor_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d doctor_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: 'backend/go.sum'

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: user
          DB_PASSWORD: password123
          DB_NAME: doctor_platform
        run: go test -v -race ./...

      - name: Build docker image
        working-directory: ./backend
        run: docker build -t doctor_platform:latest .

  # NODE 4: Global Notification Handling Module
  alert-monitoring:
    name: Pipeline Monitor Alerts
    runs-on: ubuntu-latest
    needs: [backend, frontend, compile-binary, integration-tests] # Monitors all active pipeline jobs
    if: failure() # Fires only if any of the above jobs fail
    steps:
      - name: Send Slack Message Alert
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CHAT_WEBHOOK_URL }}
          SLACK_COLOR: '#FF0000'
          SLACK_MESSAGE: "The GMC CI/CD pipeline failed! Broken by @${{ github.actor }} on branch ${{ github.ref_name }}"
          SLACK_TITLE: "Pipeline Build Failure"
