# This app connects only to Supabase (see internal/database/database.go),
# so there is no local Postgres service here — just the backend container,
# pointed at your Supabase project via DATABASE_URL.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: doctor_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USE_POOLER: ${DB_USE_POOLER:-false}
      SKIP_AUTO_MIGRATE: ${SKIP_AUTO_MIGRATE:-true}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    volumes:
      - ./backend/uploads:/app/uploads
